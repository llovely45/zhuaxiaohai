openapi: 3.1.0
info:
  title: 抓小孩 Mini App API
  version: 1.0.0
servers:
  - url: https://api.example.com/api/v1
paths:
  /telegram/session:
    post:
      summary: 校验 Telegram initData、保存指纹并创建 Redis 会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tg_init_data, fingerprint]
              properties:
                tg_init_data: { type: string }
                tg_user_id: { type: string, description: 仅作为开发提示，已验证用户ID以后端解析的initData为准 }
                tg_context: { type: object, additionalProperties: true }
                fingerprint: { type: object, additionalProperties: true }
      responses:
        "201": { description: 返回玩家和短期会话令牌 }
  /me:
    get:
      summary: 当前TG玩家资料
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "200": { description: 玩家资料 } }
  /telegram/events:
    post:
      summary: 预留的Mini App生命周期/交互事件入口
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "202": { description: 已接收 } }
  /telegram/extract-profile:
    post:
      summary: 根据TG用户名提取可访问的名称、用户名和简介
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses:
        "200": { description: 已提取资料，前端可进入编辑状态 }
        "404": { description: 机器人无法访问该账号资料 }
  /npcs:
    get:
      summary: 系统NPC列表
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "200": { description: NPC列表 } }
  /npc-applications:
    post:
      summary: 提交NPC申请
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "201": { description: 已提交 } }
  /achievements:
    get:
      summary: 当前玩家成就
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "200": { description: 成就列表 } }
  /level-submissions:
    post:
      summary: 提交玩家关卡
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "201": { description: 已提交 } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    fingerprint:
      type: apiKey
      in: header
      name: X-Device-Fingerprint
    miniappId:
      type: apiKey
      in: header
      name: X-Miniapp-ID
