openapi: 3.1.0
info:
  title: 抓小孩 Mini App API
  version: 1.0.0
servers:
  - url: https://api.example.com/api/v1
paths:
  /telegram/session:
    post:
      summary: 校验 Telegram initData、保存指纹并创建 Redis 会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tg_init_data, fingerprint]
              properties:
                tg_init_data: { type: string }
                tg_user_id: { type: string, description: 仅作为开发提示，已验证用户ID以后端解析的initData为准 }
                tg_context: { type: object, additionalProperties: true }
                fingerprint: { type: object, additionalProperties: true }
      responses:
        "201": { description: 返回玩家和短期会话令牌 }
  /me:
    get:
      summary: 当前TG玩家资料
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "200": { description: 玩家资料 } }
  /telegram/events:
    post:
      summary: 预留的Mini App生命周期/交互事件入口
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "202": { description: 已接收 } }
  /telegram/extract-profile:
    post:
      summary: 兼容旧版：根据TG用户名提取可访问的名称、用户名和简介
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses:
        "200": { description: 已提取资料，前端可进入编辑状态 }
        "404": { description: 机器人无法访问该账号资料 }
  /npcs:
    get:
      summary: 系统NPC列表
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "200": { description: NPC列表 } }
  /levels:
    get:
      summary: 获取群聊关卡脚本
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 返回 level_no、npc_id、npc_photo、messages }
        "404": { description: 关卡不存在 }
  /npc-applications:
    post:
      summary: 提交NPC申请并自动写入系统NPC
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tg_init_data, fingerprint_id, miniapp_id]
              properties:
                name: { type: string }
                description: { type: string }
                tg_init_data: { type: string, description: Telegram Mini App 原始加密凭证，后端用机器人Token验签 }
                fingerprint_id: { type: string }
                miniapp_id: { type: string }
      responses:
        "201": { description: 已通过校验并写入系统NPC，返回写入后的NPC数据 }
        "403": { description: 不符合申请要求 }
  /achievements:
    get:
      summary: 当前玩家成就
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "200": { description: 成就列表 } }
  /level-submissions/meta:
    get:
      summary: 获取提交关卡所需的随机NPC列表和AI提示词
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      responses: { "200": { description: 返回随机NPC ID和编辑器提示词 } }
  /level-submissions:
    post:
      summary: 提交玩家关卡，服务端校验格式、防重放、限频和黑名单
      security: [{ bearerAuth: [], fingerprint: [], miniappId: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, payload]
              properties:
                name: { type: string }
                description: { type: string }
                payload: { type: string, description: 'JSON数组字符串，格式 [{"npc_id":9478,"message":"..."}]' }
      responses:
        "201": { description: 已提交 }
        "400": { description: 关卡数据格式不符合要求 }
        "409": { description: 重复提交 }
        "429": { description: 短时间内提交过于频繁 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    fingerprint:
      type: apiKey
      in: header
      name: X-Device-Fingerprint
    miniappId:
      type: apiKey
      in: header
      name: X-Miniapp-ID
